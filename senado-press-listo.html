<script>
/* ============================= SUPABASE ============================= */

const SUPABASE_URL = 'https://haurlrjdhpagoiycytza.supabase.co';

const SUPABASE_READY = SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('PEGA_AQUI');
const supabaseClient = SUPABASE_READY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let realtimeChannel = null;

/* ============================= DATOS FIJOS ============================= */
const FIXED_ACCOUNTS = [
  {username:'slugo', password:'senado2026', name:'Samuel Lugo', role:'admin', title:'Secretario General'},
  {username:'mmendez', password:'boston2026', name:'Mariana Mendez', role:'admin', title:'Subsecretaria General'},
  {username:'shamburguer', password:'radio2026', name:'Sophia Hamburguer', role:'admin', title:'Presidenta'},
  {username:'vgomez', password:'debate2026', name:'Valeria Gómez', role:'admin', title:'Vicepresidenta'},
];
const DEFAULT_SENADORES = [];
const MESA_DIRECTIVA = [
  {label:'PRESIDENTA', name:'Sophia Hamburguer'},
  {label:'VICEPRESIDENTA', name:'Valeria Gómez'},
  {label:'SECRETARIO GENERAL', name:'Samuel Lugo'},
  {label:'SUBSECRETARIA GENERAL', name:'Mariana Mendez'},
];
const TAGS = {
  'Observación':'#6b6f76','Pregunta':'#2f6fed','Anuncio':'#1f8a4c','Urgente':'#c23b3b'
};
const K = { despachos:'senadopress_despachos', periodistas:'senadopress_periodistas', sesion:'senadopress_sesion', senadores:'senadopress_senadores', solicitudes:'senadopress_senador_solicitudes' };

/* ============================= ESTADO ============================= */
let state = {
  view:'login', // login | register
  currentUser:null,
  despachos:[],
  periodistas:[],
  senadores:[],
  solicitudes:[],
  sesion:{tema:'Sin tema asignado', enVivo:false, proximaSesion:'', duracion:15, proyectosActivos:0},
  adminTab:'despachos',
  notice:null,
  loading:false,
  showPassword:false,
  showPasswordReg:false,
  registerRole:'periodista',
  draftLogin:{user:'',pass:''},
  draftRegister:{name:'',correo:'',username:'',password:'',medio:''},
  draftSenadorReq:{name:'',correo:'',username:''},
  draftSenador:{name:'',cargo:'',username:'',password:''},
  solicitudEdits:{},
  draftDespacho:{content:'',tag:'Observación',image:null},
  draftComments:{},
  expanded:{},
  lastSnapshot:''
};

/* ============================= UTILIDADES ============================= */
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function setNotice(type,text,ms){
  state.notice = {type,text};
  render();
  if(ms!==0){ setTimeout(()=>{ if(state.notice && state.notice.text===text){ state.notice=null; render(); } }, ms||4500); }
}

async function getShared(key, fallback){
  if(!SUPABASE_READY){
    // Modo local de respaldo mientras se configura Supabase.
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  try{
    const {data,error} = await supabaseClient.from('senado_shared_state').select('value').eq('key',key).maybeSingle();
    if(error) throw error;
    return data ? data.value : fallback;
  }catch(e){ console.error('Supabase get error:', e); return fallback; }
}
async function setShared(key, value){
  if(!SUPABASE_READY){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ return false; }
  }
  try{
    const {error} = await supabaseClient.from('senado_shared_state').upsert({key, value, updated_at:new Date().toISOString()},{onConflict:'key'});
    if(error) throw error;
    return true;
  }catch(e){ console.error('Supabase set error:', e); setNotice('error','No se pudo guardar en Supabase. Revisa la configuración.'); return false; }
}

function startRealtime(){
  if(!SUPABASE_READY || realtimeChannel) return;
  realtimeChannel = supabaseClient.channel('senado-press-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'senado_shared_state'},payload=>{
      const key = payload.new?.key || payload.old?.key;
      if(!key) return;
      const value = payload.new?.value;
      if(key===K.despachos && value){ state.despachos=value; }
      else if(key===K.periodistas && value){ state.periodistas=value; }
      else if(key===K.sesion && value){ state.sesion=value; }
      else if(key===K.senadores && value){ state.senadores=value; }
      else if(key===K.solicitudes && value){ state.solicitudes=value; }
      state.lastSnapshot=snapshotAll();
      render();
    })
    .subscribe(status=>{
      if(status==='SUBSCRIBED') console.log('Senado Press: tiempo real conectado.');
    });
}


/* ============================= DETECCIÓN ANTI-IA ============================= */
async function detectAI(text){
  if(!text || text.trim().length < 12) return {esIA:false, confianza:0, razon:''};
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:200,
        messages:[{role:'user', content:
          'Analiza el siguiente texto (un despacho de prensa o comentario de un modelo de Naciones Unidas / Senado estudiantil) y estima si fue probablemente generado por una IA en vez de escrito por un estudiante. Responde ÚNICAMENTE con JSON válido, sin texto adicional ni backticks, con este formato exacto: {"esIA": true o false, "confianza": numero_0_a_100, "razon": "explicacion breve en español, maximo 18 palabras"}.\n\nTexto: """' + text.slice(0,2000) + '"""'
        }]
      })
    });
    const data = await res.json();
    const textOut = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    const clean = textOut.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    return {esIA: !!parsed.esIA, confianza: Number(parsed.confianza)||0, razon: parsed.razon||''};
  }catch(e){
    return {esIA:false, confianza:0, razon:'no_verificado'};
  }
}

/* ============================= CARGA Y POLLING ============================= */
async function loadAll(){
  startRealtime();
  state.despachos = await getShared(K.despachos, []);
  state.periodistas = await getShared(K.periodistas, []);
  state.sesion = await getShared(K.sesion, state.sesion);
  let senadores = await getShared(K.senadores, null);
  if(senadores === null){
    senadores = DEFAULT_SENADORES.slice();
    await setShared(K.senadores, senadores);
  }
  state.senadores = senadores;
  state.solicitudes = await getShared(K.solicitudes, []);
  state.lastSnapshot = snapshotAll();
}
function snapshotAll(){
  return JSON.stringify([state.despachos, state.periodistas, state.sesion, state.senadores, state.solicitudes]);
}

async function poll(){
  if(!state.currentUser) return;
  const [d,p,s,sen,sol] = await Promise.all([
    getShared(K.despachos,state.despachos), getShared(K.periodistas,state.periodistas),
    getShared(K.sesion,state.sesion), getShared(K.senadores,state.senadores), getShared(K.solicitudes,state.solicitudes)
  ]);
  const snap = JSON.stringify([d,p,s,sen,sol]);
  if(snap !== state.lastSnapshot){
    state.despachos = d; state.periodistas = p; state.sesion = s; state.senadores = sen; state.solicitudes = sol;
    state.lastSnapshot = snap;
    render();
  }
}

/* ============================= AUTENTICACIÓN ============================= */
function matchAccount(input, account){
  const val = (input||'').trim().toLowerCase();
  if(!val || !account) return false;
  const local = val.split('@')[0].toLowerCase();
  const username = String(account.username||'').trim().toLowerCase();
  const parts = String(account.name||'').toLowerCase().split(' ').filter(Boolean);
  const altUsername = parts.length>1 ? parts[0][0]+parts[parts.length-1] : parts[0];
  return val===username || local===username || local.replace(/\./g,'')===username || local===altUsername || local===parts.join('.');
}

async function login(){
  const {user, pass} = state.draftLogin;
  if(!user.trim() || !pass){ setNotice('error','Ingresa tu correo/usuario y contraseña.'); return; }

  const fixed = FIXED_ACCOUNTS.find(a => matchAccount(user, a) && a.password===pass);
  if(fixed){
    state.currentUser = {username:fixed.username, name:fixed.name, role:fixed.role, title:fixed.title};
    state.draftLogin = {user:'',pass:''};
    await loadAll();
    render();
    startPolling();
    return;
  }

  await loadAll();

  const senador = state.senadores.find(s => matchAccount(user, s) && s.password===pass);
  if(senador){
    state.currentUser = {username:senador.username, name:senador.name, role:'senador', title:senador.cargo};
    state.draftLogin = {user:'',pass:''};
    render();
    startPolling();
    return;
  }

  const val = user.trim().toLowerCase();
  const periodista = state.periodistas.find(p => (p.username.toLowerCase()===val || p.correo.toLowerCase()===val) && p.password===pass);
  if(periodista){
    if(periodista.status === 'bloqueado'){
      setNotice('error','Tu cuenta ha sido bloqueada por un administrador. No puedes acceder al muro de prensa.', 6000);
      return;
    }
    state.currentUser = {username:periodista.username, name:periodista.name, role:'periodista', title:periodista.medio||'Periodista'};
    state.draftLogin = {user:'',pass:''};
    render();
    startPolling();
    return;
  }

  setNotice('error','Credenciales incorrectas. Verifica tu usuario/correo y contraseña.');
}

async function registerPeriodista(){
  const r = state.draftRegister;
  if(!r.name.trim() || !r.username.trim() || !r.password || !r.correo.trim()){
    setNotice('error','Completa nombre, correo, usuario y contraseña.'); return;
  }
  await loadAll();
  const uname = r.username.trim().toLowerCase();
  const taken = FIXED_ACCOUNTS.some(a=>a.username===uname) || state.periodistas.some(p=>p.username.toLowerCase()===uname) || state.senadores.some(s=>s.username.toLowerCase()===uname);
  if(taken){ setNotice('error','Ese nombre de usuario ya está en uso.'); return; }
  const nuevo = {username:r.username.trim(), correo:r.correo.trim(), password:r.password, name:r.name.trim(), medio:r.medio.trim(), status:'libre'};
  state.periodistas.push(nuevo);
  await setShared(K.periodistas, state.periodistas);
  state.lastSnapshot = snapshotAll();
  state.currentUser = {username:nuevo.username, name:nuevo.name, role:'periodista', title:nuevo.medio||'Periodista'};
  state.draftRegister = {name:'',correo:'',username:'',password:'',medio:''};
  state.view='login';
  setNotice('success','¡Cuenta creada! Ya tienes acceso al muro de prensa.');
  startPolling();
}

async function requestSenadorAccess(){
  const r = state.draftSenadorReq;
  if(!r.name.trim() || !r.correo.trim() || !r.username.trim()){
    setNotice('error','Completa nombre, correo y usuario para solicitar acceso.'); return;
  }
  await loadAll();
  const uname = r.username.trim().toLowerCase();
  const taken = FIXED_ACCOUNTS.some(a=>a.username===uname) || state.periodistas.some(p=>p.username.toLowerCase()===uname) || state.senadores.some(s=>s.username.toLowerCase()===uname) || state.solicitudes.some(s=>s.username.toLowerCase()===uname);
  if(taken){ setNotice('error','Ese nombre de usuario ya está en uso o ya tiene una solicitud pendiente.'); return; }
  state.solicitudes.push({id:uid(), name:r.name.trim(), correo:r.correo.trim(), username:r.username.trim(), timestamp:Date.now()});
  await setShared(K.solicitudes, state.solicitudes);
  state.lastSnapshot = snapshotAll();
  state.draftSenadorReq = {name:'',correo:'',username:''};
  setNotice('success','Tu solicitud fue enviada. Un administrador debe aprobarla y asignarte una contraseña de acceso.', 6000);
  render();
}

async function addSenador(){
  const f = state.draftSenador;
  if(!f.name.trim() || !f.cargo.trim() || !f.username.trim() || !f.password.trim()){
    setNotice('error','Completa nombre, cargo, usuario y contraseña.'); return;
  }

  // Recarga primero la lista compartida para evitar sobrescribir senadores
  // agregados por otro administrador desde otro navegador.
  await loadAll();

  const uname = f.username.trim().toLowerCase();
  const taken = FIXED_ACCOUNTS.some(a=>a.username.toLowerCase()===uname) ||
    state.periodistas.some(p=>String(p.username||'').toLowerCase()===uname) ||
    state.senadores.some(s=>String(s.username||'').toLowerCase()===uname);
  if(taken){ setNotice('error','Ese nombre de usuario ya existe.'); return; }

  const nuevoSenador = {
    username: uname,
    password: f.password.trim(),
    name: f.name.trim(),
    cargo: f.cargo.trim()
  };
  const nuevaLista = [...state.senadores, nuevoSenador];
  const saved = await setShared(K.senadores, nuevaLista);
  if(!saved){
    setNotice('error','No se pudo guardar el senador. Verifica que Supabase esté configurado.');
    return;
  }

  state.senadores = nuevaLista;
  state.lastSnapshot = snapshotAll();
  state.draftSenador = {name:'',cargo:'',username:'',password:''};
  setNotice('success','Senador agregado y guardado. Ya puede iniciar sesión desde cualquier dispositivo.');
  render();
}

async function removeSenador(username){
  state.senadores = state.senadores.filter(s=>s.username!==username);
  await setShared(K.senadores, state.senadores);
  state.lastSnapshot = snapshotAll();
  render();
}

async function approveSolicitud(id){
  const sol = state.solicitudes.find(s=>s.id===id);
  if(!sol) return;
  const edit = state.solicitudEdits[id] || {cargo:'',password:''};
  if(!edit.cargo || !edit.cargo.trim() || !edit.password || !edit.password.trim()){
    setNotice('error','Define el cargo y una contraseña antes de aprobar.'); return;
  }
  const uname = sol.username.trim().toLowerCase();
  const taken = FIXED_ACCOUNTS.some(a=>a.username===uname) || state.periodistas.some(p=>p.username.toLowerCase()===uname) || state.senadores.some(s=>s.username.toLowerCase()===uname);
  if(taken){ setNotice('error','Ese usuario ya existe; pide al solicitante que use otro.'); return; }
  state.senadores.push({username:sol.username.trim().toLowerCase(), password:edit.password.trim(), name:sol.name, cargo:edit.cargo.trim()});
  state.solicitudes = state.solicitudes.filter(s=>s.id!==id);
  delete state.solicitudEdits[id];
  await Promise.all([setShared(K.senadores, state.senadores), setShared(K.solicitudes, state.solicitudes)]);
  state.lastSnapshot = snapshotAll();
  setNotice('success','Senador aprobado y cuenta creada.');
  render();
}

async function rejectSolicitud(id){
  state.solicitudes = state.solicitudes.filter(s=>s.id!==id);
  delete state.solicitudEdits[id];
  await setShared(K.solicitudes, state.solicitudes);
  state.lastSnapshot = snapshotAll();
  render();
}

function logout(){
  stopPolling();
  state.currentUser = null;
  state.view='login';
  state.adminTab='despachos';
  render();
}

let pollHandle = null;
function startPolling(){ if(pollHandle) return; pollHandle = setInterval(poll, SUPABASE_READY ? 15000 : 4000); }
function stopPolling(){ if(pollHandle){ clearInterval(pollHandle); pollHandle=null; } }

/* ============================= DESPACHOS / COMENTARIOS ============================= */
function onFileChosen(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 550*1024){ setNotice('error','La imagen es muy grande. Máximo 550 KB.'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = ()=>{ state.draftDespacho.image = reader.result; render(); };
  reader.readAsDataURL(file);
}
function clearImage(){ state.draftDespacho.image = null; render(); }

async function publish(){
  const content = state.draftDespacho.content.trim();
  if(!content){ setNotice('error','Escribe el contenido del despacho.'); return; }
  const u = state.currentUser;
  state.loading = true; render();

  const check = await detectAI(content);
  const flagged = check.esIA && check.confianza >= 50;

  const nuevo = {
    id: uid(),
    authorUsername: u.username, authorName: u.name, authorRole: u.role,
    content, image: state.draftDespacho.image, tag: state.draftDespacho.tag,
    timestamp: Date.now(),
    status: flagged ? 'pending_ai_review' : 'published',
    aiScore: check.confianza, aiReason: check.razon,
    comments: []
  };

  state.despachos.unshift(nuevo);
  await setShared(K.despachos, state.despachos);
  state.lastSnapshot = snapshotAll();
  state.draftDespacho = {content:'',tag:'Observación',image:null};
  state.loading = false;

  if(flagged){
    setNotice('warning', `Tu publicación se envió a revisión: posible contenido generado por IA (${check.confianza}% de confianza). Un administrador debe aprobarla.`, 7000);
  }else{
    setNotice('success','Despacho publicado.');
  }
  render();
}

async function addComment(despachoId){
  const text = (state.draftComments[despachoId]||'').trim();
  if(!text) return;
  const u = state.currentUser;
  const check = await detectAI(text);
  const flagged = check.esIA && check.confianza >= 50;

  const despacho = state.despachos.find(d=>d.id===despachoId);
  if(!despacho) return;
  despacho.comments.push({
    id: uid(), authorUsername:u.username, authorName:u.name, authorRole:u.role,
    content:text, timestamp:Date.now(),
    status: flagged ? 'pending_ai_review' : 'published',
    aiScore: check.confianza, aiReason: check.razon
  });
  await setShared(K.despachos, state.despachos);
  state.lastSnapshot = snapshotAll();
  state.draftComments[despachoId] = '';
  state.expanded[despachoId] = true;
  if(flagged) setNotice('warning', `Tu comentario se envió a revisión por posible contenido de IA (${check.confianza}%).`, 6000);
  render();
}

async function deleteDespacho(id){
  state.despachos = state.despachos.filter(d=>d.id!==id);
  await setShared(K.despachos, state.despachos);
  setNotice('success','Despacho eliminado.');
  render();
}
async function deleteComment(despachoId, commentId){
  const d = state.despachos.find(x=>x.id===despachoId);
  if(!d) return;
  d.comments = d.comments.filter(c=>c.id!==commentId);
  await setShared(K.despachos, state.despachos);
  render();
}
async function approveDespacho(id){
  const d = state.despachos.find(x=>x.id===id);
  if(!d) return;
  d.status = 'published';
  await setShared(K.despachos, state.despachos);
  setNotice('success','Publicación aprobada.');
  render();
}
async function rejectDespacho(id){ await deleteDespacho(id); }
async function approveComment(despachoId, commentId){
  const d = state.despachos.find(x=>x.id===despachoId);
  const c = d && d.comments.find(x=>x.id===commentId);
  if(!c) return;
  c.status='published';
  await setShared(K.despachos, state.despachos);
  render();
}
async function rejectComment(despachoId, commentId){ await deleteComment(despachoId, commentId); }

async function toggleBlock(username){
  const p = state.periodistas.find(x=>x.username===username);
  if(!p) return;
  p.status = p.status==='bloqueado' ? 'libre' : 'bloqueado';
  await setShared(K.periodistas, state.periodistas);
  setNotice('success', p.status==='bloqueado' ? `${p.name} fue bloqueado.` : `${p.name} fue desbloqueado.`);
  render();
}

async function saveSesion(){
  await setShared(K.sesion, state.sesion);
  setNotice('success','Sesión actualizada.');
  render();
}

function toggleExpand(id){ state.expanded[id] = !state.expanded[id]; render(); }

  const keys = path.split('.'); let obj = state;
  for(let i=0;i<keys.length-1;i++) obj = obj[keys[i]];
  obj[keys[keys.length-1]] = value;
}

/* ============================= RENDER: LOGIN / REGISTER ============================= */
function renderLogin(){
  return `
  <div class="auth-wrap">
    <div class="brand-block">
      <div class="brand-logos">${logoLockup(52)}</div>
      <h1 class="brand-title serif">Senado Press</h1>
      <p class="brand-sub">Sala de Prensa del Modelo de Senado</p>
      <span class="brand-pill">BIMUN 2026</span>
    </div>
    <div class="auth-card">
      <h2 class="serif">Iniciar sesión</h2>
      ${state.notice ? `<div class="notice ${state.notice.type}">${esc(state.notice.text)}</div>` : ''}
      <div class="field">
        <label>Correo institucional o usuario</label>
        <input type="text" value="${esc(state.draftLogin.user)}" placeholder="usuario o correo@institucion.edu.co" oninput="onInputPath('draftLogin.user', this.value)" onkeydown="if(event.key==='Enter'){document.getElementById('loginPassInput').focus()}">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <div class="pass-wrap">
          <input id="loginPassInput" type="${state.showPassword?'text':'password'}" value="${esc(state.draftLogin.pass)}" placeholder="••••••••••" oninput="onInputPath('draftLogin.pass', this.value)" onkeydown="if(event.key==='Enter'){login()}">
          <button onclick="state.showPassword=!state.showPassword; render();" type="button">${state.showPassword?EYE_OFF:EYE_OPEN}</button>
        </div>
      </div>
      <button class="btn-primary" ${state.loading?'disabled':''} onclick="login()">Iniciar sesión</button>
      <div class="auth-switch">¿Eres periodista y no tienes cuenta? <button onclick="state.view='register'; state.notice=null; render();">Regístrate aquí</button></div>
    </div>
    <div class="auth-footer">
      Presidencia: <b>Sophia Hamburguer</b> · Vicepresidencia: <b>Valeria Gómez</b><br>
      Secretaría General: <b>Samuel Lugo</b> · Subsecretaría General: <b>Mariana Mendez</b>
    </div>
  </div>`;
}

function renderRegister(){
  const r = state.draftRegister;
  const s = state.draftSenadorReq;
  const isPeriodista = state.registerRole === 'periodista';
  return `
  <div class="auth-wrap">
    <div class="brand-block">
      <div class="brand-logos">${logoLockup(52)}</div>
      <h1 class="brand-title serif">Senado Press</h1>
      <p class="brand-sub">Solicitud de acceso acreditado</p>
      <span class="brand-pill">BIMUN 2026</span>
    </div>
    <div class="auth-card">
      <div class="tabs" style="margin-bottom:1.3rem;">
        <button class="tab-btn ${isPeriodista?'active':''}" style="flex:1;justify-content:center;" onclick="state.registerRole='periodista'; state.notice=null; render();">Soy periodista</button>
        <button class="tab-btn ${!isPeriodista?'active':''}" style="flex:1;justify-content:center;" onclick="state.registerRole='senador'; state.notice=null; render();">Soy senador</button>
      </div>
      ${state.notice ? `<div class="notice ${state.notice.type}">${esc(state.notice.text)}</div>` : ''}

      ${isPeriodista ? `
      <h2 class="serif">Crear cuenta de periodista</h2>
      <p class="card hint" style="background:none;box-shadow:none;padding:0;margin:-0.6rem 0 1rem;">Tu cuenta queda activa de inmediato.</p>
      <div class="field"><label>Nombre completo</label><input value="${esc(r.name)}" oninput="onInputPath('draftRegister.name', this.value)"></div>
      <div class="field"><label>Correo institucional</label><input value="${esc(r.correo)}" placeholder="tunombre@institucion.edu.co" oninput="onInputPath('draftRegister.correo', this.value)"></div>
      <div class="field"><label>Usuario</label><input value="${esc(r.username)}" placeholder="ej: jperez" oninput="onInputPath('draftRegister.username', this.value)"></div>
      <div class="field">
        <label>Contraseña</label>
        <div class="pass-wrap">
          <input type="${state.showPasswordReg?'text':'password'}" value="${esc(r.password)}" oninput="onInputPath('draftRegister.password', this.value)">
          <button onclick="state.showPasswordReg=!state.showPasswordReg; render();" type="button">${state.showPasswordReg?EYE_OFF:EYE_OPEN}</button>
        </div>
      </div>
      <div class="field"><label>Medio de comunicación (opcional)</label><input value="${esc(r.medio)}" placeholder="ej: El Heraldo" oninput="onInputPath('draftRegister.medio', this.value)"></div>
      <button class="btn-primary" onclick="registerPeriodista()">Registrarme</button>
      ` : `
      <h2 class="serif">Solicitar acceso como senador</h2>
      <p class="hint" style="margin:-0.6rem 0 1rem;">Las cuentas de senador las crea un administrador. Envía tu solicitud y quedará pendiente de aprobación.</p>
      <div class="field"><label>Nombre completo</label><input value="${esc(s.name)}" oninput="onInputPath('draftSenadorReq.name', this.value)"></div>
      <div class="field"><label>Correo institucional</label><input value="${esc(s.correo)}" placeholder="tunombre@institucion.edu.co" oninput="onInputPath('draftSenadorReq.correo', this.value)"></div>
      <div class="field"><label>Usuario deseado</label><input value="${esc(s.username)}" placeholder="ej: jsenador" oninput="onInputPath('draftSenadorReq.username', this.value)"></div>
      <button class="btn-primary" onclick="requestSenadorAccess()">Enviar solicitud</button>
      `}
      <div class="auth-switch">¿Ya tienes cuenta? <button onclick="state.view='login'; state.notice=null; render();">Inicia sesión</button></div>
    </div>
  </div>`;
}

/* ============================= RENDER: HEADER / LIVE BAR ============================= */
function renderHeader(){
  const u = state.currentUser;
  return `
  <div class="app-header">
    <div class="brand">
      ${logoLockup(38)}
      <div class="titles">
        <h1 class="serif">Senado Press</h1>
        <p>Sala de Prensa — BIMUN 2026</p>
      </div>
    </div>
    <div class="role-strip">
      ${MESA_DIRECTIVA.map(m=>`<div><div class="role-label">${m.label}</div><div class="role-name">${esc(m.name)}</div></div>`).join('')}
    </div>
    <div class="me">
      <div class="who">
        <div class="name">${esc(u.name)}</div>
        <div class="tag">${roleLabel(u.role)}</div>
      </div>
      <button class="logout-btn" title="Cerrar sesión" onclick="logout()">${LOGOUT_ICON}</button>
    </div>
  </div>`;
}
function roleLabel(role){
  if(role==='admin') return 'Administrador';
  if(role==='senador') return 'Senador · solo lectura';
  return 'Periodista';
}

function renderLiveBar(){
  const s = state.sesion;
  return `
  <div class="live-bar">
    <span class="live-pill ${s.enVivo?'':'off'}">${s.enVivo?'<span class="live-dot"></span> EN VIVO':'SESIÓN NO ACTIVA'}</span>
    <span>Tema actual: <b>${esc(s.tema||'Sin tema asignado')}</b></span>
    <span class="poll-note">Actualización automática cada 4s — no necesitas recargar la página</span>
  </div>`;
}

/* ============================= RENDER: MURO / COMPOSER ============================= */
function renderComposer(){
  const d = state.draftDespacho;
  const options = Object.keys(TAGS).map(t=>`<option value="${t}" ${d.tag===t?'selected':''}>${t}</option>`).join('');
  return `
  <div class="card">
    <h3>Publicar despacho oficial</h3>
    <p class="hint">Se publica de inmediato salvo que el sistema detecte posible contenido generado por IA, en cuyo caso pasará a revisión de un administrador.</p>
    <textarea maxlength="2000" placeholder="Escribe el mensaje..." oninput="onInputPath('draftDespacho.content', this.value)">${esc(d.content)}</textarea>
    <div class="counter">${d.content.length}/2000</div>
    ${d.image ? `<div class="img-preview"><img src="${d.image}"><button onclick="clearImage()">×</button></div>` : ''}
    <div class="composer-row">
      <select onchange="onInputPath('draftDespacho.tag', this.value)">${options}</select>
      <label class="file-btn">📎 Adjuntar imagen<input type="file" accept="image/*" onchange="onFileChosen(this)"></label>
      <button class="btn-post" ${state.loading?'disabled':''} onclick="publish()">${state.loading?'Publicando...':'Publicar'}</button>
    </div>
  </div>`;
}

function renderAIFlag(item, kind, despachoId){
  if(item.status !== 'pending_ai_review') return '';
  const isAdmin = state.currentUser.role==='admin';
  const isOwn = item.authorUsername===state.currentUser.username;
  if(!isAdmin && !isOwn) return ''; // otros usuarios no ven contenido pendiente
  return `
  <div class="ai-flag">
    ⚠️ Posible contenido generado por IA (confianza ${item.aiScore}%)${item.aiReason?' — '+esc(item.aiReason):''}. ${isAdmin?'Pendiente de tu revisión.':'Un administrador debe aprobar esta publicación antes de que sea visible para los demás.'}
    ${isAdmin ? `<div class="actions">
        <button class="mini-btn approve" onclick="${kind==='despacho'?`approveDespacho('${item.id}')`:`approveComment('${despachoId}','${item.id}')`}">Aprobar publicación</button>
        <button class="mini-btn reject" onclick="${kind==='despacho'?`rejectDespacho('${item.id}')`:`rejectComment('${despachoId}','${item.id}')`}">Rechazar y eliminar</button>
      </div>` : ''}
  </div>`;
}

function renderComments(desp, opts){
  const isOpen = !!state.expanded[desp.id];
  const visibleComments = desp.comments.filter(c => c.status==='published' || c.status==='pending_ai_review');
  const count = desp.comments.filter(c=>c.status==='published').length;
  let html = `<div class="despacho-actions">
    <button class="link-btn" onclick="toggleExpand('${desp.id}')">💬 ${count} comentario${count===1?'':'s'}</button>
  </div>`;
  if(isOpen){
    html += `<div class="comments">`;
    visibleComments.forEach(c=>{
      if(c.status==='pending_ai_review'){
        html += renderAIFlag(c,'comment',desp.id);
        if(!(state.currentUser.role==='admin' || c.authorUsername===state.currentUser.username)) return;
      }
      html += `
      <div class="comment">
        <div class="comment-head">
          <span class="avatar" style="width:22px;height:22px;font-size:.65rem;">${initials(c.authorName)}</span>
          <span class="author">${esc(c.authorName)}</span>
          <span class="role-badge ${c.authorRole}">${roleLabel(c.authorRole)}</span>
          <span class="timestamp">${fmtTime(c.timestamp)}</span>
          ${opts.canModerate ? `<button class="icon-btn" title="Eliminar comentario" onclick="deleteComment('${desp.id}','${c.id}')">${TRASH_ICON}</button>` : ''}
        </div>
        <p class="comment-text">${esc(c.content)}</p>
      </div>`;
    });
    if(opts.canComment){
      html += `<div class="comment-input-row">
        <input placeholder="Escribe un comentario..." value="${esc(state.draftComments[desp.id]||'')}" oninput="onInputPath('draftComments.${desp.id}', this.value)" onkeydown="if(event.key==='Enter'){addComment('${desp.id}')}">
        <button onclick="addComment('${desp.id}')">Enviar</button>
      </div>`;
    }else{
      html += `<div class="comment-disabled">${LOCK_ICON} Los senadores tienen acceso de solo lectura y no pueden comentar.</div>`;
    }
    html += `</div>`;
  }
  return html;
}

function renderDespacho(desp, opts){
  if(desp.status==='pending_ai_review' && !(opts.canModerate || desp.authorUsername===state.currentUser.username)) return '';
  const tagColor = TAGS[desp.tag] || '#6b6f76';
  return `
  <div class="despacho">
    <div class="despacho-head">
      <span class="avatar">${initials(desp.authorName)}</span>
      <span class="author">${esc(desp.authorName)}</span>
      <span class="role-badge ${desp.authorRole}">${roleLabel(desp.authorRole)}</span>
      <span class="tag-pill" style="background:${tagColor}">${esc(desp.tag)}</span>
      <span class="timestamp">${fmtTime(desp.timestamp)}</span>
      ${opts.canModerate ? `<button class="icon-btn" title="Eliminar despacho" onclick="deleteDespacho('${desp.id}')">${TRASH_ICON}</button>` : ''}
    </div>
    ${renderAIFlag(desp,'despacho')}
    <p class="content-text">${esc(desp.content)}</p>
    ${desp.image ? `<img class="attach" src="${desp.image}">` : ''}
    ${renderComments(desp, opts)}
  </div>`;
}

function renderWall(opts){
  const visible = state.despachos;
  let html = '';
  if(opts.canPost) html += renderComposer();
  else html += `<div class="readonly-banner">${LOCK_ICON} Los senadores tienen acceso de solo lectura al muro de prensa. No pueden publicar ni comentar.</div>`;

  html += `<div class="card">
    <h3>Muro de prensa</h3>
    ${visible.length===0 ? '<p class="hint">Aún no hay despachos publicados.</p>' : visible.map(d=>renderDespacho(d, opts)).join('')}
  </div>`;
  return html;
}

/* ============================= RENDER: PANEL ADMIN ============================= */
function renderAdminTabs(){
  const tabs = [
    {id:'despachos', label:'📄 Despachos'},
    {id:'sesion', label:'📡 Sesión'},
    {id:'periodistas', label:'👥 Periodistas'},
    {id:'senadores', label:'🎗️ Senadores'},
  ];
  return `<div class="tabs">${tabs.map(t=>`<button class="tab-btn ${state.adminTab===t.id?'active':''}" onclick="setAdminTab('${t.id}')">${t.label}</button>`).join('')}</div>`;
}

function renderSesionTab(){
  const s = state.sesion;
  const totalDespachos = state.despachos.filter(d=>d.status==='published').length;
  const preguntasAbiertas = state.despachos.filter(d=>d.status==='published' && d.tag==='Pregunta').length;
  return `
  <div class="card">
    <h3>📡 Control de Sesión y Debate</h3>
    <div class="field"><label>Tema del debate (barra EN VIVO)</label><input value="${esc(s.tema)}" oninput="onInputPath('sesion.tema', this.value)"></div>
    <div class="checkline">
      <input type="checkbox" id="enVivoCk" ${s.enVivo?'checked':''} onchange="onInputPath('sesion.enVivo', this.checked)">
      <label for="enVivoCk">Sesión EN VIVO activa</label>
    </div>
    <div class="grid-2">
      <div class="field"><label>Próxima sesión</label><input type="datetime-local" value="${esc(s.proximaSesion)}" oninput="onInputPath('sesion.proximaSesion', this.value)"></div>
      <div class="field"><label>Duración (minutos)</label><input type="number" min="1" value="${esc(s.duracion)}" oninput="onInputPath('sesion.duracion', Number(this.value))"></div>
    </div>
    <div class="field"><label>Proyectos activos</label><input type="number" min="0" value="${esc(s.proyectosActivos)}" oninput="onInputPath('sesion.proyectosActivos', Number(this.value))"></div>
    <div class="grid-2" style="margin:1rem 0;">
      <div class="stat-box"><div class="num">${totalDespachos}</div><div class="lbl">Despachos publicados</div></div>
      <div class="stat-box"><div class="num">${preguntasAbiertas}</div><div class="lbl">Preguntas abiertas</div></div>
    </div>
    <button class="btn-primary" style="width:auto;padding:.75rem 1.6rem;" onclick="saveSesion()">Guardar cambios</button>
  </div>`;
}

function renderPeriodistasTab(){
  const list = state.periodistas;
  return `
  <div class="card">
    <h3>👥 Periodistas registrados (${list.length})</h3>
    ${list.length===0 ? '<p class="hint">Ningún periodista se ha registrado todavía.</p>' : `
    <table>
      <thead><tr><th>Nombre</th><th>Correo</th><th>Medio</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>
        ${list.map(p=>`
        <tr>
          <td>${esc(p.name)}</td>
          <td>${esc(p.correo)}</td>
          <td>${esc(p.medio||'—')}</td>
          <td><span class="status-pill ${p.status}">${p.status}</span></td>
          <td><button class="icon-btn" title="${p.status==='bloqueado'?'Desbloquear':'Bloquear'}" onclick="toggleBlock('${p.username}')">${p.status==='bloqueado'?'🔓':'🔒'}</button></td>
        </tr>`).join('')}
      </tbody>
    </table>`}
  </div>`;
}

function renderSenadoresTab(){
  const senadores = state.senadores;
  const f = state.draftSenador;
  let html = `
  <div class="card">
    <h3>🎗️ Senadores (${senadores.length})</h3>
    <p class="hint">Acceso de solo lectura al muro — no pueden publicar ni comentar.</p>
    ${senadores.length===0 ? '<p class="hint">Todavía no hay senadores registrados.</p>' : `
    <table>
      <thead><tr><th>Nombre</th><th>Cargo</th><th>Usuario</th><th>Acceso</th><th>Acciones</th></tr></thead>
      <tbody>
        ${senadores.map(s=>`<tr>
          <td>${esc(s.name)}</td><td>${esc(s.cargo)}</td><td>${esc(s.username)}</td>
          <td><span class="status-pill libre">solo lectura</span></td>
          <td><button class="icon-btn" title="Eliminar senador" onclick="removeSenador('${esc(s.username)}')">${TRASH_ICON}</button></td>
        </tr>`).join('')}
      </tbody>
    </table>`}
  </div>

  <div class="card">
    <h3>➕ Agregar senador</h3>
    <p class="hint">Crea una cuenta de senador directamente con acceso de solo lectura.</p>
    <div class="grid-2">
      <div class="field"><label>Nombre completo</label><input value="${esc(f.name)}" oninput="onInputPath('draftSenador.name', this.value)"></div>
      <div class="field"><label>Cargo</label><input value="${esc(f.cargo)}" placeholder="ej: Senador de la República" oninput="onInputPath('draftSenador.cargo', this.value)"></div>
      <div class="field"><label>Usuario</label><input value="${esc(f.username)}" oninput="onInputPath('draftSenador.username', this.value)"></div>
      <div class="field"><label>Contraseña</label><input value="${esc(f.password)}" oninput="onInputPath('draftSenador.password', this.value)"></div>
    </div>
    <button class="btn-primary" style="width:auto;padding:.75rem 1.6rem;" onclick="addSenador()">Agregar senador</button>
  </div>`;

  if(state.solicitudes.length>0){
    html += `<div class="card">
      <h3>📥 Solicitudes de acceso pendientes (${state.solicitudes.length})</h3>
      ${state.solicitudes.map(sol=>{
        if(!state.solicitudEdits[sol.id]) state.solicitudEdits[sol.id] = {cargo:'',password:''};
        const e = state.solicitudEdits[sol.id];
        return `
        <div style="border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.9rem;">
          <div style="font-weight:700;">${esc(sol.name)} <span class="timestamp">· ${esc(sol.correo)} · usuario deseado: ${esc(sol.username)}</span></div>
          <div class="grid-2" style="margin-top:.7rem;">
            <div class="field" style="margin-bottom:.5rem;"><label>Cargo a asignar</label><input value="${esc(e.cargo)}" placeholder="ej: Senadora" oninput="onInputPath('solicitudEdits.${sol.id}.cargo', this.value)"></div>
            <div class="field" style="margin-bottom:.5rem;"><label>Contraseña a asignar</label><input value="${esc(e.password)}" oninput="onInputPath('solicitudEdits.${sol.id}.password', this.value)"></div>
          </div>
          <div class="actions" style="display:flex;gap:.6rem;">
            <button class="mini-btn approve" onclick="approveSolicitud('${sol.id}')">Aprobar y crear cuenta</button>
            <button class="mini-btn reject" onclick="rejectSolicitud('${sol.id}')">Rechazar</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  return html;
}

/* ============================= RENDER: PRINCIPAL ============================= */
function renderMain(){
  const u = state.currentUser;
  let content = '';
  if(u.role==='admin'){
    content += renderAdminTabs();
    if(state.adminTab==='despachos') content += renderWall({canPost:true, canComment:true, canModerate:true});
    else if(state.adminTab==='sesion') content += renderSesionTab();
    else if(state.adminTab==='periodistas') content += renderPeriodistasTab();
    else if(state.adminTab==='senadores') content += renderSenadoresTab();
  }else if(u.role==='periodista'){
    content += renderWall({canPost:true, canComment:true, canModerate:false});
  }else{
    content += renderWall({canPost:false, canComment:false, canModerate:false});
  }
  return `<div class="main-wrap">
    ${state.notice ? `<div class="notice ${state.notice.type}">${esc(state.notice.text)}</div>` : ''}
    ${content}
  </div>`;
}

/* ============================= RENDER RAÍZ ============================= */
function render(){
  const app = document.getElementById('app');
  if(!state.currentUser){
    app.innerHTML = state.view==='register' ? renderRegister() : renderLogin();
  }else{
    app.innerHTML = renderHeader() + renderLiveBar() + renderMain();
  }
}

/* ============================= INICIO ============================= */
render();
</script>
</body>
</html>
